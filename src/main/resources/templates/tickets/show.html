<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title>Ticket</title>
  </head>

  <!--navbar-->
  <div th:replace="~{fragments/navbar :: header}"></div>

  <body>
    <section class="container">
      <h1 class="text-center mt-3 mb-3">Ticket: [[${ticket.title}]]</h1>

      <div class="card text-center">
        <div class="d-flex justify-content-center">
          <img
            src="https://usersnap.com/blog/wp-content/uploads/2021/03/7-Excellent-Open-Source-Bug-Tracking-Tools-by-Usersnap@1x-1280x720.png"
            class="img-fluid rounded shadow"
            style="width: 50%; max-width: 500px"
          />
        </div>
        <div class="card-header">Featured</div>
        <div class="card-body">
          <h5 class="card-title">[[${ticket.title}]]</h5>
          <p class="card-text">[[${ticket.description}]]</p>
          <a th:href="@{/ticket}" class="btn btn-outline-primary"
            >Back to the list</a
          >
        </div>
        <div class="card-footer text-body-secondary">
          <b>Created at -></b> [[${ticket.createdAt}]] ||
          <b>Updated at -></b> [[${ticket.updatedAt}]] ||
          <b>Due Date -></b> [[${ticket.dueDate}]]
        </div>
      </div>
    </section>

    <!-- Bootstrap Bundle JS (includes Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
