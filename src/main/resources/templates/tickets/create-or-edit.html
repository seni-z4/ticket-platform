<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title>Ticket</title>
  </head>

  <!--navbar-->
  <div th:replace="~{fragments/navbar :: header}"></div>

  <body class="container" th:object="${ticket}">
    <h1 class="text-center mt-3 mb-3">Create a new ticket</h1>

    <form
      th:if="${create} ? @{/ticket/create}: @{|/ticket/edit/${ticket.id}|}"
      th:object="${ticket}"
      method="post"
    >
      <div class="mb-3">
        <label for="title" class="form-label">Title:</label>
        <input
          type="text"
          class="form-control"
          id="title"
          aria-describedby="title"
          th:field="*{title}"
          th:errorclass="is-invalid"
        />

        <div th:if="${#fields.hasErrors('title')}" class="invalid-feedback">
          <ul>
            <li
              th:each="err : ${#fields.errors('title')}"
              th:text="${err}"
            ></li>
          </ul>
        </div>
      </div>

      <div class="mb-3">
        <label for="status">Status:</label>
        <select id="status" name="status" class="form-control">
          <option value="">Select a status</option>
          <option
            th:each="st : ${statuses}"
            th:value="${st.id}"
            th:text="${st.status}"
            th:selected="${ticket.status != null && st.id == ticket.status.id}"
          >
            > >
          </option>
        </select>

        <div th:if="${#fields.hasErrors('status')}" class="invalid-feedback">
          <ul>
            <li
              th:each="err : ${#fields.errors('status')}"
              th:text="${err}"
            ></li>
          </ul>
        </div>
      </div>

      <div class="mb-3">
        <label for="createdAt" class="form-label">created At:</label>
        <input
          type="date"
          class="form-control"
          id="createdAt"
          aria-describedby="createdAt"
          th:field="*{createdAt}"
          th:errorclass="is-invalid"
        />

        <div th:if="${#fields.hasErrors('createdAt')}" class="invalid-feedback">
          <ul>
            <li
              th:each="err : ${#fields.errors('createdAt')}"
              th:text="${err}"
            ></li>
          </ul>
        </div>
      </div> -->

      <!-- <div class="mb-3">
        <label for="updatedAt" class="form-label">updated At:</label>
        <input
          type="date"
          class="form-control"
          id="updatedAt"
          aria-describedby="updatedAt"
          th:field="*{updatedAt}"
          th:errorclass="is-invalid"
        />

        <div th:if="${#fields.hasErrors('updatedAt')}" class="invalid-feedback">
          <ul>
            <li
              th:each="err : ${#fields.errors('updatedAt')}"
              th:text="${err}"
            ></li>
          </ul>
        </div>
      </div> -->

      <div class="mb-3">
        <label for="dueDate" class="form-label">Due Date:</label>
        <input
          type="date"
          class="form-control"
          id="dueDate"
          aria-describedby="dueDate"
          th:field="*{dueDate}"
          th:errorclass="is-invalid"
        />

        <div th:if="${#fields.hasErrors('dueDate')}" class="invalid-feedback">
          <ul>
            <li
              th:each="err : ${#fields.errors('dueDate')}"
              th:text="${err}"
            ></li>
          </ul>
        </div>
      </div>

      <div class="mb-3">
        <label for="description" class="form-label">Description:</label>
        <input
          type="text"
          class="form-control"
          id="description"
          aria-describedby="description"
          th:field="*{description}"
          th:errorclass="is-invalid"
        />

        <div
          th:if="${#fields.hasErrors('description')}"
          class="invalid-feedback"
        >
          <ul>
            <li
              th:each="err : ${#fields.errors('description')}"
              th:text="${err}"
            ></li>
          </ul>
        </div>
      </div>

      <div class="mb-3">
        <label for="user" class="form-label"
          >Assign an Available Operator:</label
        >
        <select class="form-control" id="user" th:field="*{user.id}">
          <option value="">Select an Operator</option>
          <option
            th:each="user : ${users}"
            th:value="${user.id}"
            th:text="${user.name + ' ' + user.surname}"
          ></option>
        </select>

        <div th:if="${#fields.hasErrors('user')}" class="invalid-feedback">
          <ul>
            <li th:each="err : ${#fields.errors('user')}" th:text="${err}"></li>
          </ul>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
  </body>
</html>
