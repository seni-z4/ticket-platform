<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" th:href="@{/css/styles.css}" />
    <title>Ticket</title>
  </head>

  <!--navbar-->
  <div th:replace="~{fragments/navbar :: header}"></div>

  <body class="bg-light">
    <h2 class="mt-4 mb-4 container">System Dashboard</h2>

    <div
      sec:authorize="hasRole('ROLE_ADMIN')"
      class="d-flex justify-content-between align-items-center container"
    >
      <a class="btn btn-primary mt-2 mb-4" th:href="@{/ticket/create}">
        Create a New Ticket
      </a>
      <div th:replace="~{fragments/serachbar :: searchbar}"></div>
    </div>

    <th:block th:replace="~{fragments/flashMessage :: flashMessage}"></th:block>

    <table
      class="table table-bordered table-striped table-hover align-middle container"
      th:if="${tickets.size() > 0}"
    >
      <thead class="table-secondary">
        <tr>
          <th scope="col">id</th>
          <th scope="col">title</th>
          <th scope="col">description</th>
          <!-- <th scope="col">created At</th>
          <th scope="col">Updated At</th>
          <th scope="col">Due Date</th> -->
          <th scope="col">Assigned Operator</th>
          <th scope="col"></th>
          <th scope="col"></th>
          <th scope="col"></th>

          <th scope="col"></th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="ticket : ${tickets}" th:object="${ticket}">
          <td th:text="*{id}"></td>
          <td th:text="*{title}"></td>
          <td th:text="*{description}"></td>
          <td
            th:text="${ticket.user != null ? ticket.user.name + ' ' + ticket.user.surname : 'Unassigned'}"
          ></td>
          <!-- <td
            th:text="${#temporals.format(ticket.createdAt, 'yyyy-MM-dd HH:mm')}"
          ></td>
          <td
            th:text="${#temporals.format(ticket.updatedAt, 'yyyy-MM-dd HH:mm')}"
          ></td>
          <td th:text="*{dueDate}"></td> -->

          <td>
            <a
              th:href="@{/notes/create/{id}(id=*{id})}"
              class="btn btn-sm btn-outline-secondary"
              >Notes</a
            >
          </td>

          <td>
            <a
              th:href="@{/ticket/{id}(id=*{id})}"
              class="btn btn-sm btn-primary"
              >Show</a
            >
          </td>
          <td>
            <a
              th:href="@{/ticket/edit/{id}(id=*{id})}"
              class="btn btn-sm btn-warning"
              >Edit</a
            >
          </td>
          <td sec:authorize="hasRole('ROLE_ADMIN')">
            <button
              type="button"
              class="btn btn-sm btn-danger"
              data-bs-toggle="modal"
              th:data-bs-target="'#delete-model-'+ *{id}"
            >
              delete
            </button>

            <div
              class="modal fade"
              th:id="'delete-model-'+ *{id}"
              tabindex="-1"
              aria-labelledby="exampleModalLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                  <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">
                      Ticket Title : [[${ticket.title}]]
                    </h1>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Close"
                    ></button>
                  </div>
                  <div class="modal-body">
                    are you sure you want to delete this ticket
                    [[${ticket.title}]]?
                  </div>
                  <div class="modal-footer">
                    <button
                      type="button"
                      class="btn btn-secondary"
                      data-bs-dismiss="modal"
                    >
                      Close
                    </button>
                    <form
                      th:action="@{/ticket/delete/{id}(id=*{id})}"
                      method="post"
                    >
                      <input
                        type="submit"
                        value="delete"
                        class="btn btn-danger"
                      />
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <h3 class="alert alert-warning container" th:unless="${tickets.size() > 0}">
      no filters found !!!
    </h3>

    <!-- Bootstrap Bundle JS (includes Popper.js) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
