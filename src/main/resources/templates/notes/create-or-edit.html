  <body class="container" th:object="${note}">
    <h1 class="text-center mt-3 mb-3">Create a new ticket</h1>

    <h4>Add a New Note</h4>
    <form
      th:action=" ${create} ? @{/notes/create} : @{|/notes/edit/${note.id}|}"
      th:object="${note}"
      method="post"
    >
      <input type="hidden" name="ticketId" th:value="*{ticket.id}" />

      <div class="mb-3">
        <label for="author" class="form-label">Author:</label>
        <input
          type="text"
          class="form-control"
          id="author"
          th:field="*{autore}"
          required
        />
      </div>

      <div class="mb-3">
        <label for="text" class="form-label">Note:</label>
        <textarea
          class="form-control"
          id="text"
          th:field="*{textArea}"
          required
        ></textarea>
      </div>

      <button type="submit" class="btn btn-success">Add Note</button>
    </form>
